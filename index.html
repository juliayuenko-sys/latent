<!DOCTYPE html>

<style>
  :root{
    --ground:#12151A; --ink:#F0EDE6; --muted:#9BA2AB; --gold:#C9A34E; --line:#2A2F37;
    --serif:"Noto Serif TC","Songti TC",serif;
    --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--ground); color:var(--ink); font-family:var(--sans);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:48px 16px; line-height:1.8;
  }
  .card{max-width:560px; width:100%; display:flex; flex-direction:column; gap:28px}
  .brand{font-family:var(--sans); font-size:13px; letter-spacing:.22em; color:var(--gold); text-transform:uppercase}
  h1{font-family:var(--serif); font-size:clamp(30px,7vw,46px); margin:0; line-height:1.35; text-wrap:balance}
  .rule{width:48px; height:2px; background:var(--gold); border:0; margin:0}
  p{margin:0; color:var(--muted); max-width:34em}
  .name{font-family:var(--serif); font-size:20px; color:var(--ink)}
  .foot{border-top:1px solid var(--line); padding-top:20px; font-size:14px; color:var(--muted); display:flex; flex-direction:column; gap:6px}
  a{color:var(--gold); text-decoration:none}
  a:hover,a:focus-visible{text-decoration:underline}
</style>
</head>
<body>
  <main class="card">
    <span class="brand">此刻 · The Present</span>
    <h1>你最值錢嗰一面，<br>你自己睇唔到。</h1>

    <p>網站籌備中，正式推出前接受少量個案。</p>
    <div class="foot">
      <span>查詢：<a href="mailto:juliayuenko@gmail.com">juliayuenko@gmail.com</a></span>
      <span>主站：<a href="https://juliayuen.com">juliayuen.com</a></span>
    </div>
  </main>
